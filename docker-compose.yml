services:
  mongo: { image: mongo:7, ports: ['27017:27017'], volumes: ['mongo:/data/db'] }
  redis: { image: redis:7-alpine, ports: ['6379:6379'] }
  api:
    build: ./backend
    command: npm run dev
    environment: [MONGODB_URI=mongodb://mongo:27017/student-hub, REDIS_URL=redis://redis:6379]
    ports: ['8080:8080']
    depends_on: [mongo, redis]
volumes: { mongo: {} }
